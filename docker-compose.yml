x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me-32b-min}
  DEBUG: ${DEBUG:-True}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
  DATABASE_URL: postgres://postgres:postgres@db:5432/app
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://frontend:5173}
  LOGIN_2FA_ENABLED: ${LOGIN_2FA_ENABLED:-False}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-App <noreply@example.com>}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-False}
  CELERY_TASK_EAGER_PROPAGATES: ${CELERY_TASK_EAGER_PROPAGATES:-False}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: .
    volumes:
      - .:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["uv", "run", "celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - .:/app
      - backend_venv:/app/.venv
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  backend_venv:
